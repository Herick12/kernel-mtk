name: Compilar Kernel Android 14 com Namespaces

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Código-Fonte do Kernel
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev git libncurses5-dev ccache

      - name: Configurar Cache do Compilador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Injetar Configurações exigidas pelo Droidspaces
        run: |
          TARGET_PATH="arch/arm64/configs/gki_defconfig"
          
          if [ ! -f "$TARGET_PATH" ]; then
            echo "ERRO: O arquivo gki_defconfig não foi encontrado!"
            exit 1
          fi

          echo "" >> $TARGET_PATH
          echo "# Configurações injetadas para suporte ao Droidspaces" >> $TARGET_PATH
          echo "CONFIG_NAMESPACES=y" >> $TARGET_PATH
          echo "CONFIG_PID_NS=y" >> $TARGET_PATH
          echo "CONFIG_IPC_NS=y" >> $TARGET_PATH
          echo "CONFIG_DEVTMPFS=y" >> $TARGET_PATH
          echo "CONFIG_DEVTMPFS_MOUNT=y" >> $TARGET_PATH
          
          echo "Sucesso! As flags foram injetadas:"
          tail -n 10 $TARGET_PATH

      - name: Baixar Proton Clang (Compilador Otimizado)
        run: |
          mkdir -p android-clang
          cd android-clang
          curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz --strip-components=1
          cd ..

      - name: Compilar o Kernel Linux
        run: |
          CLANG_DIR="$GITHUB_WORKSPACE/android-clang/bin"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          export HOSTCC=gcc
          export HOSTCXX=g++
          export HOSTLD=ld
          
          export CC="ccache $CLANG_DIR/clang"
          export CROSS_COMPILE="$CLANG_DIR/aarch64-linux-gnu-"
          export CROSS_COMPILE_COMPAT="$CLANG_DIR/arm-linux-gnueabi-"
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make O=out distclean
          
          # Configura e atualiza o defconfig
          make O=out CC="$CC" CROSS_COMPILE="$CROSS_COMPILE" gki_defconfig
          make O=out CC="$CC" CROSS_COMPILE="$CROSS_COMPILE" olddefconfig
          
          # COMPILAÇÃO FORÇADA: Alvos explícitos ordenados para gerar o binário vmlinux unificado
          make O=out -j4 \
            CC="$CC" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            AR="$CLANG_DIR/llvm-ar" \
            NM="$CLANG_DIR/llvm-nm" \
            OBJCOPY="$CLANG_DIR/llvm-objcopy" \
            OBJDUMP="$CLANG_DIR/llvm-objdump" \
            STRIP="$CLANG_DIR/llvm-strip" \
            LD="$CLANG_DIR/ld.lld" \
            SKIP_ABI_LINUX=1 \
            STRICT_ALIGNMENT=1 \
            vmlinux modules || true

          # Força a geração manual da Image extraindo-a do vmlinux se o make principal parou antes
          if [ -f "out/vmlinux" ] && [ ! -f "out/arch/arm64/boot/Image" ]; then
            echo "Gerando a Image bruta manualmente a partir do vmlinux..."
            mkdir -p out/arch/arm64/boot/
            $CLANG_DIR/llvm-objcopy -O binary out/vmlinux out/arch/arm64/boot/Image
          fi

      - name: Escanear Pasta Out (Rastreador de Arquivos)
        run: |
          echo "=== PROCURANDO POR ARQUIVOS GERADOS ==="
          find out/ -name "Image*" -type f || echo "Nenhuma Image encontrada"
          find out/ -maxdepth 2 -name "vmlinux*" -type f || echo "Nenhum vmlinux encontrado"
          echo "=============================================="

      - name: Verificar, Comprimir e Mover o Kernel para Upload
        run: |
          mkdir -p output/
          
          IMAGE_PATH=$(find out/ -name "Image" -type f -print -quit)
          IMAGE_GZ_PATH=$(find out/ -name "Image.gz" -type f -print -quit)
          
          if [ ! -z "$IMAGE_PATH" ]; then
            echo "Sucesso! Image encontrada em: $IMAGE_PATH. Compactando..."
            gzip -c "$IMAGE_PATH" > output/Image.gz
          elif [ ! -z "$IMAGE_GZ_PATH" ]; then
            echo "Sucesso! Image.gz encontrada em: $IMAGE_GZ_PATH"
            cp "$IMAGE_GZ_PATH" output/Image.gz
          else
            echo "ERRO CRÍTICO: Não foi possível estruturar o binário final do Kernel!"
            exit 1
          fi

      - name: Compactar e Disponibilizar o Kernel Gerado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Android14-Droidspaces
          path: output/Image.gz
          

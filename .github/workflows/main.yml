name: Compilar Kernel Android 14 com Namespaces

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Código-Fonte do Kernel
        uses: actions/checkout@v4

      - name: Instalar Dependências Básicas do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev git libncurses5-dev ccache rsync

      - name: Configurar Cache do Compilador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Injetar Configurações exigidas pelo Droidspaces
        run: |
          TARGET_PATH="arch/arm64/configs/gki_defconfig"
          
          if [ ! -f "$TARGET_PATH" ]; then
            echo "Aviso: gki_defconfig não encontrado na raiz, procurando em subpastas..."
            TARGET_PATH=$(find . -name "gki_defconfig" -type f -print -quit)
          fi

          if [ ! -z "$TARGET_PATH" ]; then
            echo "" >> "$TARGET_PATH"
            echo "# Configurações injetadas para suporte ao Droidspaces" >> "$TARGET_PATH"
            echo "CONFIG_NAMESPACES=y" >> "$TARGET_PATH"
            echo "CONFIG_PID_NS=y" >> "$TARGET_PATH"
            echo "CONFIG_IPC_NS=y" >> "$TARGET_PATH"
            echo "CONFIG_DEVTMPFS=y" >> "$TARGET_PATH"
            echo "CONFIG_DEVTMPFS_MOUNT=y" >> "$TARGET_PATH"
            echo "Flags injetadas com sucesso em: $TARGET_PATH"
            tail -n 10 "$TARGET_PATH"
          else
            echo "Aviso: Não foi possível injetar as flags estaticamente. Tentando compilação direta."
          fi

      - name: Baixar Proton Clang (Compilador Otimizado)
        run: |
          mkdir -p android-clang
          cd android-clang
          curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz --strip-components=1
          cd ..

      - name: Compilar via Ecossistema Oficial Android GKI
        run: |
          CLANG_DIR="$GITHUB_WORKSPACE/android-clang/bin"
          
          # Injeta o compilador de forma limpa no PATH apenas para o ambiente do script wrapper
          export PATH="$CLANG_DIR:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          # Variáveis necessárias para os wrappers oficiais da Motorola/MediaTek
          export CC="clang"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export LD_LIBRARY_PATH="$CLANG_DIR/../lib:$LD_LIBRARY_PATH"
          
          # Desativa validações estritas de ABI que quebram o build em repositórios customizados
          export SKIP_ABI_LINUX=1
          export SKIP_MRPROPER=1
          export STRICT_ALIGNMENT=1
          
          # Configura diretórios padrões usados pelo script build.sh do ecossistema Google/MTK
          export OUT_DIR="$GITHUB_WORKSPACE/out"
          export DIST_DIR="$GITHUB_WORKSPACE/out/dist"

          # 1. TENTATIVA COM BAZEL / KLEAF (Padrão Android 14 Oficial)
          if [ -f "tools/bazel" ] || [ -f "prebuilts/kernel-build-tools/linux-x86/bin/bazel" ]; then
            echo "Detectado ecossistema Kleaf (Bazel). Iniciando build oficial..."
            # Procura o alvo gki no arquivo build.config
            ./tools/bazel build //common:kernel_aarch64_dist --skip_abi || true
          
          # 2. TENTATIVA COM SCRIPT WRAPPER (Padrão MediaTek/Motorola Customizado)
          elif [ -f "build/build.sh" ]; then
            echo "Detectado script oficial em build/build.sh. Iniciando compilação..."
            chmod +x build/build.sh
            BUILD_CONFIG=build.config.gki.aarch64 ./build/build.sh || true
          
          elif [ -f "build.sh" ]; then
            echo "Detectado script oficial na raiz. Iniciando compilação..."
            chmod +x build.sh
            ./build.sh || true
          
          # 3. FALLBACK DE FORÇA BRUTA (Se nenhum script oficial existir, força os alvos atômicos do Makefile)
          else
            echo "Nenhum script wrapper detectado. Forçando linkagem explícita via Make clássico..."
            export HOSTCC=gcc
            export HOSTCXX=g++
            export HOSTLD=ld
            make O=out CC="ccache clang" CROSS_COMPILE="aarch64-linux-gnu-" gki_defconfig
            make O=out CC="ccache clang" CROSS_COMPILE="aarch64-linux-gnu-" olddefconfig
            # Compila o arquivo bruto diretamente, pulando o alvo 'modules' que está gerando o conflito na raiz
            make O=out -j4 CC="ccache clang" CROSS_COMPILE="aarch64-linux-gnu-" Image || true
          fi

      - name: Escanear Diretórios por Binários Gerados
        run: |
          echo "=== VARREDURA COMPLETA DE ARQUIVOS GERADOS ==="
          find . -name "Image*" -not -path "./android-clang/*" -type f || echo "Nenhuma Image encontrada"
          find . -name "vmlinux*" -not -path "./android-clang/*" -type f -maxdepth 4 || echo "Nenhum vmlinux encontrado"
          echo "=============================================="

      - name: Verificar, Comprimir e Mover o Kernel para Upload
        run: |
          mkdir -p output/
          
          # Procura dinamicamente onde o script oficial ou o make salvou o binário
          IMAGE_PATH=$(find . -name "Image" -not -path "./android-clang/*" -type f -print -quit)
          IMAGE_GZ_PATH=$(find . -name "Image.gz" -not -path "./android-clang/*" -type f -print -quit)
          
          if [ ! -z "$IMAGE_PATH" ]; then
            echo "Sucesso absoluto! Image encontrada em: $IMAGE_PATH. Compactando..."
            gzip -c "$IMAGE_PATH" > output/Image.gz
          elif [ ! -z "$IMAGE_GZ_PATH" ]; then
            echo "Sucesso absoluto! Image.gz encontrada em: $IMAGE_GZ_PATH"
            cp "$IMAGE_GZ_PATH" output/Image.gz
          else
            echo "ERRO CRÍTICO: O binário final não pôde ser estruturado pelos métodos oficiais!"
            exit 1
          fi

      - name: Compactar e Disponibilizar o Kernel Gerado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Android14-Droidspaces
          path: output/Image.gz

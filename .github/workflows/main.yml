name: Compilar Kernel Android 14 com Namespaces

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Código-Fonte do Kernel
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          # Adicionado o pacote 'dwarves' que fornece o 'pahole' exigido pelo BTF
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev git libncurses5-dev ccache rsync dwarves

      - name: Configurar Cache do Compilador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Injetar Configurações (Droidspaces e Correções de Build)
        run: |
          TARGET_PATH="arch/arm64/configs/gki_defconfig"
          
          if [ ! -f "$TARGET_PATH" ]; then
            TARGET_PATH=$(find . -name "gki_defconfig" -type f -print -quit)
          fi

          if [ ! -z "$TARGET_PATH" ]; then
            echo "" >> "$TARGET_PATH"
            echo "# Configurações injetadas para suporte ao Droidspaces" >> "$TARGET_PATH"
            echo "CONFIG_NAMESPACES=y" >> "$TARGET_PATH"
            echo "CONFIG_PID_NS=y" >> "$TARGET_PATH"
            echo "CONFIG_IPC_NS=y" >> "$TARGET_PATH"
            echo "CONFIG_DEVTMPFS=y" >> "$TARGET_PATH"
            echo "CONFIG_DEVTMPFS_MOUNT=y" >> "$TARGET_PATH"
            
            echo "# Desativando BTF para evitar quebras por falta de ferramentas de debug" >> "$TARGET_PATH"
            echo "CONFIG_DEBUG_INFO_BTF=n" >> "$TARGET_PATH"
            
            echo "Flags injetadas com sucesso em: $TARGET_PATH"
            tail -n 12 "$TARGET_PATH"
          fi

      - name: Baixar Proton Clang (Compilador Otimizado)
        run: |
          mkdir -p android-clang
          cd android-clang
          curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz --strip-components=1
          cd ..

      - name: Compilar o Kernel Linux (Make Clássico Isolado)
        run: |
          CLANG_DIR="$GITHUB_WORKSPACE/android-clang/bin"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          export HOSTCC=gcc
          export HOSTCXX=g++
          export HOSTLD=ld
          
          # Define os caminhos absolutos para todo o conjunto de ferramentas do Proton
          export CC="ccache $CLANG_DIR/clang"
          export CROSS_COMPILE="$CLANG_DIR/aarch64-linux-gnu-"
          export CROSS_COMPILE_COMPAT="$CLANG_DIR/arm-linux-gnueabi-"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Garante que o gerador de defconfig use o mesmo LLVM/Linker para não corromper as regras
          export DEF_ARGS="CC=$CC CROSS_COMPILE=$CROSS_COMPILE AR=$CLANG_DIR/llvm-ar LD=$CLANG_DIR/ld.lld"

          # Limpa resíduos de builds anteriores
          make O=out distclean
          
          # Configura a base de dados GKI de forma segura usando o herramental correto
          make O=out $DEF_ARGS gki_defconfig
          make O=out $DEF_ARGS olddefconfig
          
          # Compila a Image ligando tudo com as ferramentas LLVM dedicadas
          make O=out -j4 \
            CC="$CC" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            AR="$CLANG_DIR/llvm-ar" \
            NM="$CLANG_DIR/llvm-nm" \
            OBJCOPY="$CLANG_DIR/llvm-objcopy" \
            OBJDUMP="$CLANG_DIR/llvm-objdump" \
            STRIP="$CLANG_DIR/llvm-strip" \
            LD="$CLANG_DIR/ld.lld" \
            SKIP_ABI_LINUX=1 \
            STRICT_ALIGNMENT=1 \
            Image

      - name: Escanear Diretórios por Binários Gerados
        run: |
          echo "=== VARREDURA DE ARQUIVOS GERADOS ==="
          find out/ -name "Image*" -type f || echo "Nenhuma Image encontrada"
          echo "=============================================="

      - name: Verificar, Comprimir e Mover o Kernel para Upload
        run: |
          mkdir -p output/
          
          IMAGE_PATH=$(find out/ -name "Image" -type f -print -quit)
          IMAGE_GZ_PATH=$(find out/ -name "Image.gz" -type f -print -quit)
          
          if [ ! -z "$IMAGE_PATH" ]; then
            echo "Sucesso! Image encontrada em: $IMAGE_PATH. Compactando..."
            gzip -c "$IMAGE_PATH" > output/Image.gz
          elif [ ! -z "$IMAGE_GZ_PATH" ]; then
            echo "Sucesso! Image.gz encontrada em: $IMAGE_GZ_PATH"
            cp "$IMAGE_GZ_PATH" output/Image.gz
          else
            echo "ERRO CRÍTICO: O arquivo Image não pôde ser gerado."
            exit 1
          fi

      - name: Compactar e Disponibilizar o Kernel Gerado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Android14-Droidspaces
          path: output/Image.gz
          

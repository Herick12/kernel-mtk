name: Compilar Kernel Android 14 com Namespaces

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Código-Fonte do Kernel
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm git libncurses5-dev ccache

      - name: Configurar Cache do Compilador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Injetar Configurações exigidas pelo Droidspaces
        run: |
          TARGET_PATH="arch/arm64/configs/gki_defconfig"
          
          if [ ! -f "$TARGET_PATH" ]; then
            echo "ERRO: O arquivo gki_defconfig não foi encontrado!"
            exit 1
          fi

          echo "" >> $TARGET_PATH
          echo "# Configurações injetadas para suporte ao Droidspaces" >> $TARGET_PATH
          echo "CONFIG_NAMESPACES=y" >> $TARGET_PATH
          echo "CONFIG_PID_NS=y" >> $TARGET_PATH
          echo "CONFIG_IPC_NS=y" >> $TARGET_PATH
          echo "CONFIG_DEVTMPFS=y" >> $TARGET_PATH
          echo "CONFIG_DEVTMPFS_MOUNT=y" >> $TARGET_PATH
          
          echo "Sucesso! As flags foram injetadas:"
          tail -n 10 $TARGET_PATH

      - name: Baixar Clang Oficial do Google (AOSP Toolchain)
        run: |
          mkdir -p android-clang
          cd android-clang
          # Baixa a versão estável do Clang utilizada no Android 14 gki
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz
          tar -xf clang-r487747c.tar.gz
          cd ..

      - name: Compilar o Kernel Linux (Método GKI Direto)
        run: |
          export PATH="$GITHUB_WORKSPACE/android-clang/bin:$PATH"
          export CC="ccache clang"
          
          # Limpa resíduos anteriores
          make O=out ARCH=arm64 distclean
          
          # Configura a base GKI
          make O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- LD=ld.lld gki_defconfig
          
          # Tenta gerar o alvo Image puramente (sem compressão externa que costuma quebrar)
          make O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip SKIP_ABI_LINUX=1 STRICT_ALIGNMENT=1 -j4 Image || true

      - name: Verificar, Comprimir e Mover o Kernel para Upload
        run: |
          mkdir -p output/
          # Verifica se gerou Image bruta ou compactada e prepara para o flash
          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "Sucesso! O Kernel Image bruto foi encontrado. Compactando..."
            gzip -c out/arch/arm64/boot/Image > output/Image.gz
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Sucesso! O Kernel Image.gz já foi gerado compactado."
            cp out/arch/arm64/boot/Image.gz output/
          else
            echo "ERRO CRÍTICO: O compilador falhou antes de gerar o binário da Image!"
            exit 1
          fi

      - name: Compactar e Disponibilizar o Kernel Gerado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Android14-Droidspaces
          path: output/Image.gz
          

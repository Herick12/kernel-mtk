name: Compilar Kernel Android 14 com Namespaces

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Código-Fonte do Kernel
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm git libncurses5-dev ccache

      - name: Configurar Cache do Compilador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Injetar Configurações exigidas pelo Droidspaces
        run: |
          TARGET_PATH="arch/arm64/configs/gki_defconfig"
          
          if [ ! -f "$TARGET_PATH" ]; then
            echo "ERRO: O arquivo gki_defconfig não foi encontrado!"
            exit 1
          fi

          echo "" >> $TARGET_PATH
          echo "# Configurações injetadas para suporte ao Droidspaces" >> $TARGET_PATH
          echo "CONFIG_NAMESPACES=y" >> $TARGET_PATH
          echo "CONFIG_PID_NS=y" >> $TARGET_PATH
          echo "CONFIG_IPC_NS=y" >> $TARGET_PATH
          echo "CONFIG_DEVTMPFS=y" >> $TARGET_PATH
          echo "CONFIG_DEVTMPFS_MOUNT=y" >> $TARGET_PATH
          
          echo "Sucesso! As flags foram injetadas:"
          tail -n 10 $TARGET_PATH

      - name: Baixar Clang Oficial do Android (AOSP Toolchain Garantida)
        uses: zyansheep/setup-android-toolchain@v1
        with:
          toolchain-version: 'r487747c' # Versão exata para Android 14 GKI

      - name: Compilar o Kernel Linux
        run: |
          # Define o ambiente para usar o Clang do Android recém-instalado
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          # Limpa compilações quebradas anteriores
          make O=out distclean
          
          # Configura a base de dados GKI Motorola
          make O=out gki_defconfig
          
          # Compila focando puramente na Image gerando os drivers compatíveis
          make O=out SKIP_ABI_LINUX=1 STRICT_ALIGNMENT=1 -j4 Image modules

      - name: Verificar, Comprimir e Mover o Kernel para Upload
        run: |
          mkdir -p output/
          # Varre as pastas possíveis onde o binário do kernel do Android 14 se esconde
          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "Sucesso! Encontrado em out/arch/arm64/boot/Image"
            gzip -c out/arch/arm64/boot/Image > output/Image.gz
          elif [ -f "out/Image" ]; then
            echo "Sucesso! Encontrado na raiz da out"
            gzip -c out/Image > output/Image.gz
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Sucesso! Kernel já compactado pela fabricante"
            cp out/arch/arm64/boot/Image.gz output/
          else
            echo "ERRO CRÍTICO: O compilador falhou. Verifique as linhas vermelhas acima no passo anterior!"
            exit 1
          fi

      - name: Compactar e Disponibilizar o Kernel Gerado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Android14-Droidspaces
          path: output/Image.gz
